<!DOCTYPE html>
<html>
<head>
    <title>Approval Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-4">
    <h1>Pending Orders</h1>
    <div id="orders"></div>
</div>

<script>
function loadOrders(){

fetch("http://localhost:3000/registrations")
.then(res => res.json())
.then(data => {

    let output = "";

    for(let i = 0; i < data.length; i++){

        if(data[i].status === "pending"){

            output += `
            <div class="card mb-3">
                <div class="card-body text-dark">

                    <h5>${data[i].customer.name}</h5>
                    <p>${data[i].customer.email}</p>
                    <p>Total: $${data[i].totalCost}</p>

                    <button onclick="updateStatus('${data[i].id}', 'approved')" class="btn btn-success">
                        Approve
                    </button>

                    <button onclick="updateStatus('${data[i].id}', 'declined')" class="btn btn-danger">
                        Decline
                    </button>

                </div>
            </div>
            `;
        }
    }

    document.getElementById("orders").innerHTML = output;

});
}

function updateStatus(id, status){

fetch("http://localhost:3000/registrations/" + id, {
    method: "PATCH",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({ status: status })
})
.then(() => {
    loadOrders(); // refresh list
});

}

loadOrders();
</script>

</body>
</html>
