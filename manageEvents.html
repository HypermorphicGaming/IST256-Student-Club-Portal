<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Events | Student Club Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div class="container my-5 p-5">
        <div class="card p-4 mb-4">
            <h2 class="text-center mb-2">Manage Events</h2>
            <p class="text-center text-muted mb-4">Create, update, and review student club events.</p>

            <form id="signupForm" class="row g-3 needs-validation" novalidate>

                <div class="col-md-6">
                    <label for="eventName" class="form-label">Event Name <strong class="text-danger">*</strong></label>
                    <input type="text" class="form-control" id="eventName" name="eventName" placeholder="Event name"
                        autocomplete="off" required>
                    <div class="text-danger" id="eventNameError"></div>
                </div>

                <div class="col-md-6">
                    <label for="eventCategory" class="form-label">Event Type/Category <strong class="text-danger">*</strong></label>
                    <select class="form-select" id="eventCategory" name="eventCategory" required>
                        <option value="">Choose...</option>
                        <option value="social">Social</option>
                        <option value="meeting">Meeting</option>
                        <option value="professional">Professional</option>
                    </select>
                    <div class="text-danger" id="eventCategoryError"></div>
                </div>

                <div class="col-md-6">
                    <label for="eventDuration" class="form-label">Event Duration</label>
                    <input type="text" class="form-control" id="eventDuration" name="eventDuration" placeholder="1 hour"
                        autocomplete="off">
                    <div class="text-danger" id="eventDurationError"></div>
                </div>

                <div class="col-md-6">
                    <label for="admissionFee" class="form-label">Admission Fee</label>
                    <input type="text" class="form-control" id="admissionFee" name="admissionFee" placeholder="Free/$5"
                        autocomplete="off">
                    <div class="text-danger" id="admissionFeeError"></div>
                </div>

                <div class="col-md-6">
                    <label for="locationRoomNumber" class="form-label">Location/Room Number <strong class="text-danger">*</strong></label>
                    <input type="text" class="form-control" id="locationRoomNumber" name="locationRoomNumber" placeholder="Room 201"
                        autocomplete="off" required>
                    <div class="text-danger" id="locationRoomNumberError"></div>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Add Event</button>
                    <button class="btn btn-secondary" type="reset">Clear Form</button>
                </div>
            </form>
        </div>

        <div id="signupMessage" class="alert alert-success fade d-none" role="alert">
            <div class="d-flex justify-content-between align-items-center">
                <span><strong>Status:</strong> <span id="signupMessageText"></span></span>
                <button type="button" class="btn-close" id="signupMessageClose" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

    </div>

    <div class="container mt-1 mb-5 p-5 text-center">
        <h3 class="mb-3">Event Directory</h3>
        <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search events...">
        <div class="my-5" id="userCard">

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto d-flex align-items-center justify-content-center">
        <p class="mb-0">&copy; 2026 Student Club Portal | IST 256 Group 1</p>
    </footer>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"></script>
    <script src="js/navbar.js"></script>
    <!-- <script src="js/cart.js"></script> -->
    <script src="js/validation.js"></script>
</body>

</html>
