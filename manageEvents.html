<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Events | Student Club Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div class="container my-5 p-5">
        <div class="card p-4 mb-4">
            <h2 class="text-center mb-2">Manage Events</h2>

            <form id="signupForm" class="row g-3 needs-validation" novalidate>

                <div class="col-md-6">
                    <label for="eventName" class="form-label">Event Name <strong class="text-danger">*</strong></label>
                    <input type="text" class="form-control" id="eventName" name="eventName"
                        autocomplete="off" required>
                    <div class="text-danger" id="eventNameError"></div>
                </div>

                <div class="col-md-6">
                    <label for="eventCategory" class="form-label">Event Type/Category <strong class="text-danger">*</strong></label>
                    <select class="form-select" id="eventCategory" name="eventCategory" required>
                        <option value="">Choose...</option>
                        <option value="social">Social</option>
                        <option value="meeting">Meeting</option>
                        <option value="professional">Professional</option>
                    </select>
                    <div class="text-danger" id="eventCategoryError"></div>
                </div>

                <div class="col-md-6">
                    <label for="eventDuration" class="form-label">Event Duration</label>
                    <div class="d-flex gap-3 align-items-center">
                        <input type="range" class="form-range flex-grow-1" id="eventDuration" name="eventDuration"
                            min="15" max="180" step="15" value="60">
                        <span id="eventDurationDisplay" class="badge bg-secondary fw-normal" style="min-width: 60px;">1h</span>
                    </div>
                    <div class="text-danger" id="eventDurationError"></div>
                </div>

                <div class="col-md-6">
                    <label for="eventDate" class="form-label">Event Date <strong class="text-danger">*</strong></label>
                    <input type="date" class="form-control" id="eventDate" name="eventDate" required>
                    <div class="text-danger" id="eventDateError"></div>
                </div>

                <div class="col-md-6">
                    <label for="eventTime" class="form-label">Start Time</label>
                    <input type="time" class="form-control" id="eventTime" name="eventTime">
                    <div class="text-danger" id="eventTimeError"></div>
                </div>

                <div class="col-md-6">
                    <label for="eventCost" class="form-label">Registration Cost (USD)</label>
                    <input type="number" class="form-control" id="eventCost" name="eventCost"
                        min="0" step="0.01" autocomplete="off" value="0">
                    <div class="text-danger" id="eventCostError"></div>
                </div>

                <div class="col-md-6">
                    <label for="openSeats" class="form-label">Open Seats <strong class="text-danger">*</strong></label>
                    <input type="number" class="form-control" id="openSeats" name="openSeats"
                        min="1" step="1" autocomplete="off" required>
                    <div class="text-danger" id="openSeatsError"></div>
                </div>

                <div class="col-md-6">
                    <label for="locationRoomNumber" class="form-label">Location/Room Number <strong class="text-danger">*</strong></label>
                    <input type="text" class="form-control" id="locationRoomNumber" name="locationRoomNumber"
                        autocomplete="off" required>
                    <div class="text-danger" id="locationRoomNumberError"></div>
                </div>

                <div class="col-12">
                    <label for="eventDescription" class="form-label">Event Description <strong class="text-danger">*</strong></label>
                    <textarea class="form-control" id="eventDescription" name="eventDescription" rows="3" required></textarea>
                    <div class="text-danger" id="eventDescriptionError"></div>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Add Event</button>
                    <button class="btn btn-secondary" type="reset">Clear Form</button>
                </div>
            </form>
        </div>

        <div id="signupMessage" class="alert alert-success fade d-none" role="alert">
            <div class="d-flex justify-content-between align-items-center">
                <span><strong>Status:</strong> <span id="signupMessageText"></span></span>
                <button type="button" class="btn-close" id="signupMessageClose" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

    </div>

    <div class="container mt-1 mb-5 p-5 text-center">
        <h3 class="mb-3">Event Directory</h3>
        <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search events...">
        <div class="my-5" id="userCard">

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto d-flex align-items-center justify-content-center">
        <p class="mb-0">&copy; 2026 Student Club Portal | IST 256 Group 1</p>
    </footer>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"></script>
    <script src="js/navbar.js"></script>
    <script src="js/validation.js"></script>
    <script>
        // Event Duration Slider Display
        const updateDurationDisplay = () => {
            const minutes = parseInt($('#eventDuration').val());
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            let display = '';
            if (hours > 0) {
                display += hours + 'h';
                if (mins > 0) display += ' ' + mins + 'm';
            } else {
                display = mins + 'm';
            }
            $('#eventDurationDisplay').text(display);
        };
        
        $('#eventDuration').on('input', updateDurationDisplay);
        // Initialize on page load
        updateDurationDisplay();
    </script>
</body>

</html>
