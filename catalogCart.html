<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club Portal - Event Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">
    <main class="container-fluid flex-grow-1">
        <div class="row g-3 mt-3">
            <div class="col-lg-8">
                <section class="catalog-section">
                    <div class="mb-4">
                        <input type="text" class="form-control form-control-lg" id="productSearch"
                            placeholder="Search events..." aria-label="Search events">
                    </div>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="productGrid">
                    </div>
                </section>
            </div>
            <div class="col-lg-4">
                <aside class="cart-sidebar sticky-top" style="top: 1rem;">
                    <div class="card cart-card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Registration Cart</h5>
                        </div>
                        <div class="card-body d-flex flex-column" style="min-height: 140px;">
                            <div id="cartItems" class="d-flex flex-column gap-2"></div>
                            <div id="cartMessage" class="mb-2"></div>
                        </div>
                        <div class="card-footer bg-light">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold">Total Cost:</span>
                                <span class="fw-bold text-primary" id="cartTotal">$0.00</span>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success w-100" id="checkoutBtn"
                                onclick="window.location.href='checkout.html'">
                                Checkout
                            </button>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto d-flex align-items-center justify-content-center">
        <p class="mb-0">&copy; 2026 Student Club Portal | IST 256 Group 1</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"></script>
    <script src="js/navbar.js"></script>
    <script src="js/catalogCart.js"></script>

</body>

</html>
